<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE | Logged Out</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

        :root {
            --black: #10100f;
            --cream: #fbfaf7;
            --gold: #d8b878;
            --gold-bright: #f0d49a;
            --muted: #b8b4ad;
            --line: rgba(216, 184, 120, 0.28);
        }

        * { box-sizing: border-box; }
        body { align-items: center; background: var(--black); color: var(--cream); display: flex; font-family: 'Manrope', sans-serif; justify-content: center; margin: 0; min-height: 100vh; overflow: hidden; padding: 1.25rem; }
        body::before { background-image: linear-gradient(rgba(216, 184, 120, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(216, 184, 120, 0.07) 1px, transparent 1px); background-size: 5rem 5rem; content: ''; inset: 0; position: fixed; z-index: -2; }
        body::after { background: var(--gold); border-radius: 50%; box-shadow: 0 0 120px rgba(216, 184, 120, 0.28); content: ''; height: 20rem; position: fixed; right: -9rem; top: -9rem; width: 20rem; z-index: -1; }
        .logout-card { background: rgba(16, 16, 15, 0.94); border: 1px solid var(--line); max-width: 34rem; padding: clamp(2rem, 7vw, 5rem); position: relative; text-align: center; width: 100%; }
        .logout-card::before { border: 1px solid var(--line); border-radius: 50%; content: ''; height: 11rem; left: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); width: 11rem; z-index: -1; }
        .eyebrow { color: var(--gold-bright); font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.7rem, 8vw, 4.5rem); letter-spacing: -.04em; line-height: .95; margin: 1.5rem 0 1rem; }
        p { color: var(--muted); line-height: 1.6; margin: 0 auto 2rem; max-width: 23rem; }
        .login-link { background: var(--gold-bright); color: var(--black); display: inline-block; font-weight: 700; padding: .85rem 1.25rem; text-decoration: none; }
        .login-link:hover { background: var(--cream); }
    </style>
</head>
<body>
    <main class="logout-card">
        <span class="eyebrow">FORGE / Session ended</span>
        <h1>You are logged out.</h1>
        <p>Your account session has been closed. Return to the access page whenever you are ready to continue.</p>
        <a class="login-link" href="index.html">Return to login</a>
    </main>
</body>
</html>
